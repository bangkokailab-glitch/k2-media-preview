<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="color-scheme" content="dark"><title>K2 Family Office｜Media ファーストビュー</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#181511;color:#faf7ef}body{font-family:'Arial','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-weight:400}
.hero{position:relative;isolation:isolate;min-height:100vh;height:100vh;overflow:hidden;background:#26221b}.background,.film{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.background{object-fit:cover;z-index:-3}.film{z-index:-2;background:linear-gradient(180deg,rgba(15,14,12,.43),rgba(15,14,12,.22) 27%,rgba(15,14,12,.38) 50%,rgba(15,14,12,.30) 65%,rgba(15,14,12,.52)),rgba(18,17,14,.12)}
.header{position:absolute;top:0;left:0;width:100%;z-index:3;background:linear-gradient(180deg,#100e0bc0,transparent)}.header-inner{width:80%;max-width:1200px;margin:auto;min-height:106px;display:flex;align-items:center;justify-content:space-between;gap:36px;border:0}.brand{display:block;flex:0 0 239px;line-height:0}.brand img{width:239px;height:auto}.nav{display:flex;align-items:center;gap:32px;white-space:nowrap;font-size:13px;letter-spacing:.06em}.nav a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:42px;text-shadow:0 1px 9px #18151180}.nav a:hover{opacity:.72}.nav a:focus-visible,.motion-button:focus-visible{outline:2px solid #f0e2c5;outline-offset:6px}.service{gap:9px}.service span{font-size:15px}.future-login{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;min-width:166px;height:53px;border:1px solid #e9dfcb80;background:#1f1b1312;padding:0 12px;cursor:default;user-select:none}.future-login small{font-size:10px;letter-spacing:.1em}.future-login strong{font-size:10px;font-weight:400;letter-spacing:.22em}
.hero-copy{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:0 5vw;pointer-events:none}.hero-copy h1{font-family:'Arial','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:clamp(19.2px,3.6vw,33.6px);font-weight:400;letter-spacing:6px;line-height:1.7;text-align:center;margin:0;text-shadow:0 2px 20px #0a0a078c,0 1px 5px #0a0a0740;word-break:keep-all;overflow-wrap:normal}
.motion-button{position:absolute;bottom:28px;right:max(4vw,28px);height:34px;width:34px;border:1px solid #f5efdf70;background:#15110b35;border-radius:50%;display:grid;place-items:center;color:#faf7ef;cursor:pointer;backdrop-filter:blur(4px)}.motion-button svg{width:11px;height:11px}.motion-button .play{display:none}.motion-button.paused .play{display:block}.motion-button.paused .pause{display:none}.overlay-only .hero,.overlay-only,.overlay-only body{background:transparent}.overlay-only .background{visibility:hidden}.overlay-only .motion-button{display:none}.preview-note{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#1f1b15e6;padding:10px 18px;border:1px solid #b8a48270;font-size:12px;border-radius:3px;z-index:9}.preview-note:empty{display:none}
@media(max-width:1250px){.header-inner{width:90%;gap:24px}.brand,.brand img{width:205px;flex-basis:205px}.nav{gap:22px;font-size:12px}.future-login{min-width:150px}.hero-copy h1{letter-spacing:6px;font-size:29px}}
@media(max-width:960px){.header-inner{flex-wrap:wrap;justify-content:center;padding:22px 0;gap:15px}.nav{width:100%;justify-content:center;gap:20px}.hero-copy h1{font-size:28px;letter-spacing:5px}}
@media(max-width:600px){.header-inner{width:92%;padding:24px 0 18px}.brand,.brand img{width:210px;flex-basis:210px}.nav{flex-wrap:wrap;gap:5px 19px;font-size:11px}.future-login{height:38px;min-width:145px;gap:3px}.future-login small,.future-login strong{font-size:8px}.hero-copy{padding:0 4vw}.hero-copy h1{font-size:clamp(18px,4.5vw,26px);line-height:1.9;letter-spacing:.06em}}

.menu-toggle{display:none;background:none;border:0;color:#faf7ef;width:44px;height:44px;padding:10px;cursor:pointer;position:relative;flex-shrink:0}
.menu-toggle span{display:block;width:24px;height:1px;background:currentColor;position:absolute;left:10px;top:21px;transition:transform .18s,opacity .18s}
.menu-toggle span:first-child{transform:translateY(-7px)}.menu-toggle span:last-child{transform:translateY(7px)}
.menu-toggle[aria-expanded="true"] span:first-child{transform:rotate(45deg)}.menu-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}.menu-toggle[aria-expanded="true"] span:last-child{transform:rotate(-45deg)}
.menu-toggle:focus-visible{outline:2px solid #f0e2c5;outline-offset:3px}
@media(max-width:960px){
.header-inner{width:calc(100% - 40px);min-height:88px;padding:16px 0;flex-wrap:nowrap;justify-content:space-between;gap:16px}
.brand,.brand img{width:210px;flex-basis:210px}.menu-toggle{display:block}
.header .nav{display:none;position:absolute;top:100%;left:0;right:0;width:100%;max-height:calc(100dvh - 88px);overflow-y:auto;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:12px;padding:24px max(20px,5vw) 30px;background:#211c16f5;box-shadow:0 16px 24px #0003;white-space:normal;font-size:14px}
.header.menu-open{background:#211c16f5}.header.menu-open .nav{display:flex}.header .nav a{min-height:44px}.header .future-login{min-width:166px;height:53px;gap:5px;margin-top:8px}.header .future-login small,.header .future-login strong{font-size:10px}
}
@media(prefers-reduced-motion:reduce){.menu-toggle span{transition:none}}
</style></head><body><main class="hero" aria-label="K2 Family Office メディア">
<video id="background-video" class="background" autoplay muted loop playsinline preload="auto" poster="assets/poster.jpg?v=20261018" aria-hidden="true"><source src="assets/k2-background-mobile-30s.mp4?v=20261018" type="video/mp4" media="(max-width:600px)"><source src="assets/k2-background-30s.mp4?v=20261018" type="video/mp4"></video><div class="film"></div>
<header class="header"><div class="header-inner"><a class="brand" href="/" aria-label="K2 Family Office Media"><img src="assets/k2-lp-logo.svg" alt="K2 Family Office" width="1330" height="235"></a><button class="menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="main-nav"><span></span><span></span><span></span></button><nav id="main-nav" class="nav" aria-label="メインナビゲーション"><a href="/" data-preview="Media">Media</a><a href="/guide/01/" data-preview="Guide">Guide</a><a href="/family-office/" class="service" data-preview="サービスLP">ファミリーオフィスを持つ</a><div class="future-login" aria-label="MY FAMILY OFFICE LOGIN 準備中"><small>MY FAMILY OFFICE</small><strong>LOGIN</strong></div></nav></div></header>
<div class="hero-copy"><h1>経営も、資産も、家族も。<br>その先の人生を設計する。</h1></div>
<button class="motion-button" type="button" aria-label="背景動画を一時停止"><svg class="pause" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="1" width="2" height="10"/><rect x="8" y="1" width="2" height="10"/></svg><svg class="play" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="m3 1 8 5-8 5z"/></svg></button><div class="preview-note" role="status" aria-live="polite"></div>
</main><script>
const q=new URLSearchParams(location.search);const v=document.getElementById('background-video'),b=document.querySelector('.motion-button');if(matchMedia('(max-width:600px)').matches)v.poster='assets/poster-mobile.jpg?v=20261018';if(q.has('overlay')){document.documentElement.classList.add('overlay-only');v.removeAttribute('autoplay');v.pause()}
function sync(){b.classList.toggle('paused',v.paused);b.setAttribute('aria-label',v.paused?'背景動画を再生':'背景動画を一時停止')};b.addEventListener('click',()=>v.paused?v.play().catch(()=>{}):v.pause());v.addEventListener('play',sync);v.addEventListener('pause',sync);if(matchMedia('(prefers-reduced-motion: reduce)').matches&&!q.has('capture')){v.removeAttribute('autoplay');v.pause()}if(q.has('capture'))v.addEventListener('loadeddata',()=>{v.pause();v.currentTime=Number(q.get('time')||1)},{once:true});
let toastTimer;function notice(s){const n=document.querySelector('.preview-note');n.textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.textContent='',3200)}document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();notice((a.dataset.preview||'Media')+'への導線です。今回はファーストビューの確認用です。')}));sync();

const menuButton=document.querySelector('.menu-toggle'),header=document.querySelector('.header');
function closeMenu(restoreFocus=false){header.classList.remove('menu-open');menuButton.setAttribute('aria-expanded','false');menuButton.setAttribute('aria-label','メニューを開く');if(restoreFocus)menuButton.focus()}
menuButton.addEventListener('click',()=>{const open=menuButton.getAttribute('aria-expanded')!=='true';header.classList.toggle('menu-open',open);menuButton.setAttribute('aria-expanded',String(open));menuButton.setAttribute('aria-label',open?'メニューを閉じる':'メニューを開く')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&header.classList.contains('menu-open'))closeMenu(true)});
document.addEventListener('click',e=>{if(!header.contains(e.target))closeMenu()});
document.querySelectorAll('.header a').forEach(a=>a.addEventListener('click',()=>closeMenu(true)));
matchMedia('(max-width:960px)').addEventListener('change',()=>closeMenu());
</script></body></html>
